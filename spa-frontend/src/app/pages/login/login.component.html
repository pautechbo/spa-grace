<div class="min-h-screen bg-gradient-to-br from-rosewood-50 via-white to-rosewood-100 flex flex-col justify-center items-center p-4">
  <div class="relative w-full max-w-md bg-white rounded-2xl shadow-xl p-8 space-y-6">
    <div class="text-center">
      <a href="{{ apiUrl }}" class="text-3xl font-display font-bold text-rosewood-700 block mb-6">SpaGrace</a>
      <h1 class="text-2xl font-bold text-gray-800">Bienvenido de Nuevo</h1>
      <p class="text-gray-500 mt-1 text-sm">Iniciá sesión para acceder al dashboard</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-5">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700">Usuario</label>
        <input id="username" formControlName="username" type="text"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-rosewood-500 focus:border-rosewood-500 transition duration-200"
          placeholder="tu-usuario">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
        <input id="password" formControlName="password" type="password"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-rosewood-500 focus:border-rosewood-500 transition duration-200"
          placeholder="••••••••">
      </div>

      @if (loginError()) {
      <div class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-3 text-sm">{{ loginError() }}</div>
      }

      <button type="submit" [disabled]="loginForm.invalid || isSubmitting()"
        class="w-full py-3.5 bg-rosewood-600 text-white rounded-xl hover:bg-rosewood-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition font-semibold shadow-lg shadow-rosewood-200 flex items-center justify-center gap-2">
        @if (isSubmitting()) {
        <i class="fas fa-spinner fa-spin"></i>
        <span>Ingresando...</span>
        } @else {
        <i class="fas fa-sign-in-alt"></i>
        <span>Iniciar Sesión</span>
        }
      </button>

      <p class="text-center text-sm text-gray-500">
        ¿No tenés cuenta?
        <a href="{{ apiUrl }}" class="text-rosewood-600 hover:underline font-semibold">Registrate aquí</a>
      </p>
    </form>
  </div>

  <div class="fixed top-4 left-4">
    <a href="{{ apiUrl }}"
      class="flex items-center gap-2 px-4 py-2 bg-white rounded-xl shadow-sm border border-gray-200 text-gray-600 hover:text-rosewood-600 hover:border-rosewood-200 transition text-sm font-medium">
      <i class="fas fa-arrow-left"></i>
      <span>Volver al inicio</span>
    </a>
  </div>
</div>
